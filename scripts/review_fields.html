<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entry checks</title>
<style>
:root {
  --bg: #f6f3ee; --panel: #fffdf9; --ink: #1d1b19; --muted: #6b655d; --line: #e2dcd2;
  --red: #b3261e; --green: #1f7a3d; --amber: #9a6700; --blue: #2b5a9e; --chip: #efe9df; --hit: #fbe4a6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161412; --panel: #1f1c19; --ink: #ece6dd; --muted: #a39b90; --line: #36312b;
          --red: #ef6b5f; --green: #5cc282; --amber: #e0a93a; --blue: #7aa7e8; --chip: #2b2723; --hit: #5a4615; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line);
         display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 16px; }
header h1 { font-size: 17px; margin: 0 6px 0 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button, header select { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg);
                              color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.tabs button.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tabs button .n { opacity: .65; margin-left: 4px; }
.count { color: var(--muted); font-size: 13px; }
main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 90px; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin-bottom: 10px; }
.name { font-size: 20px; font-weight: 650; }
.chip { background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 13px; }
.src { color: var(--muted); font-size: 13px; }
.what { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 8px;
        padding: 10px 12px; margin-bottom: 12px; }
.what b { color: var(--red); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.box h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.text { white-space: pre-wrap; font-size: 14px; }
mark { background: var(--hit); color: inherit; border-radius: 2px; }
.scan { display: block; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; background: #fff; margin-top: 6px; }
.edit label { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: center; margin: 4px 0; font-size: 13px; color: var(--muted); }
.edit input, .edit textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
                              border-radius: 6px; padding: 5px 8px; width: 100%; }
.edit input.changed, .edit textarea.changed { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue); }
.edit textarea { min-height: 70px; resize: vertical; }
.answered { display: inline-block; padding: 4px 10px; border-radius: 6px; font-weight: 600; background: var(--chip); }
.answered.fix, .answered.merge { color: var(--blue); } .answered.keep { color: var(--green); }
.answered.delete { color: var(--red); } .answered.unsure { color: var(--amber); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
       padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.bar button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 8px 14px; cursor: pointer; color: #fff; }
.bar .fix { background: var(--blue); } .bar .keep { background: var(--green); } .bar .delete { background: var(--red); }
.bar .merge { background: #6b4fa0; } .bar .unsure { background: var(--amber); } .bar .nav { background: var(--chip); color: var(--ink); font-weight: 500; }
.bar input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 200px; flex: 1; max-width: 340px; }
kbd { font: 12px ui-monospace, monospace; background: rgba(255,255,255,.22); border-radius: 3px; padding: 0 4px; margin-left: 4px; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }
.err { color: var(--red); font-weight: 600; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } .edit label { grid-template-columns: 95px 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Entry checks</h1>
  <div class="tabs" id="tabs"></div>
  <select id="show"><option value="open">Open</option><option value="unsure">Not sure</option><option value="done">Answered</option><option value="all">All</option></select>
  <span class="count" id="count"></span>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div class="bar" id="bar" hidden>
  <button class="nav" id="prev">←</button>
  <button class="fix" data-a="fix">Fix<kbd>Enter</kbd></button>
  <button class="keep" data-a="keep">Right as it is<kbd>K</kbd></button>
  <button class="delete" data-a="delete">Delete record<kbd>X</kbd></button>
  <button class="merge" data-a="merge" id="mergeBtn">Merge into the first<kbd>M</kbd></button>
  <button class="unsure" data-a="unsure">Not sure<kbd>U</kbd></button>
  <input id="note" placeholder="Note (optional)">
  <button class="nav" id="undo">Take back<kbd>Z</kbd></button>
  <button class="nav" id="next">→</button>
</div>
<script>
const LABELS = {
  'unit_numbers/word': 'A word read as a sub-unit number', 'unit_numbers/glued': 'A place\'s letters read as a sub-unit number',
  'unit_numbers/other_number': 'Sub-unit number the entry doesn\'t print', 'unit_numbers/books_differ': 'Books give other sub-units',
  'life_dates/born_after_death': 'Born after he died', 'life_dates/child': 'A child (born after 1932 or dead before 12)',
  'life_dates/after_war': 'Fell after the war', 'death_place/not_a_place': 'Place of death holds other words',
  'names/short_given': 'Given name of one or two letters', 'names/odd_char': 'Scan characters in a name',
  'names/inner_capital': 'A capital inside a name', 'glued/glued_entry': 'Another man glued into the entry',
  'deserter/deserter': 'Deserter or traitor words (the rule of 14 Oct)', 'duplicates/same_entry_twice': 'The same entry twice in a unit',
};
const FIELD_LABELS = { last_name: 'Surname', middle_name: 'Father as printed', fathers_name: 'Father (nominative)',
  first_name: 'Given name', birth_year: 'Birth year', birth_place: 'Birthplace', death_type: 'Fate', death_date: 'Death date',
  death_place: 'Place of death', unit_detail: 'Sub-unit', additional_info: 'Entry text' };
const NAME_FIELDS = ['last_name', 'middle_name', 'fathers_name', 'first_name'];
let rows = [], answers = {}, by = '', tab = '', show = 'open', list = [], i = 0, last = null;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const group = r => `${r.check}/${r.kind}`;

async function load() {
  const res = await fetch('/api/queue').then(r => r.json());
  rows = res.rows; answers = res.answers; by = res.by;
  const groups = [...new Set(rows.map(group))];
  if (!tab || !groups.includes(tab)) tab = groups.find(g => rows.some(r => group(r) === g && !answers[r.key])) || groups[0] || '';
  render();
}

function filtered() {
  return rows.filter(r => group(r) === tab && (
    show === 'all' || (show === 'open' && !answers[r.key]) || (show === 'unsure' && answers[r.key] === 'unsure')
    || (show === 'done' && answers[r.key] && answers[r.key] !== 'unsure')));
}

function tabs() {
  const groups = [...new Set(rows.map(group))].sort();
  document.getElementById('tabs').innerHTML = groups.map(g => {
    const open = rows.filter(r => group(r) === g && !answers[r.key]).length;
    return `<button class="${g === tab ? 'on' : ''}" data-g="${esc(g)}">${esc(LABELS[g] || g)}<span class="n">${open}</span></button>`;
  }).join('');
}

function crop(e) {
  if (!e || !e.pdf_file || !e.box) return e && e.source_url ? `<div class="src">No scan on the site (${esc(e.source_url)})</div>` : '';
  const q = new URLSearchParams({ file: e.pdf_file, page: e.pdf_page, box: e.box.join(',') });
  if (e.rects) q.set('rects', JSON.stringify(e.rects));
  return `<div class="src">${esc(e.pdf_file)}, page ${e.pdf_page}</div><img class="scan" loading="lazy" src="/crop?${q}">`;
}

function highlight(text, r) {
  const m = /"…?(.+?)…?"/.exec(r.note || '');
  let t = esc(text);
  const needle = m ? m[1].replace(/^…|…$/g, '').trim() : '';
  const words = [];
  if (needle && needle.length < 40) words.push(needle);
  if (r.field !== 'record' && r.field !== 'additional_info' && r.value && r.value.length < 40) words.push(r.value);
  for (const w of words) {
    const at = t.indexOf(esc(w));
    if (at >= 0) t = t.slice(0, at) + '<mark>' + t.slice(at, at + esc(w).length) + '</mark>' + t.slice(at + esc(w).length);
  }
  return t;
}

function editor(r) {
  const f = r.fields || {};
  const show = [...NAME_FIELDS];
  if (r.field !== 'record' && !show.includes(r.field)) show.push(r.field);
  for (const k of ['birth_year', 'death_type', 'death_date', 'death_place']) if (r.check === 'life_dates' && !show.includes(k)) show.push(k);
  const val = k => k === 'additional_info' ? r.text : (f[k] ?? '');
  return show.map(k => {
    const v = esc(val(k));
    const input = k === 'additional_info' ? `<textarea data-k="${k}" data-v="${v}">${v}</textarea>`
      : `<input data-k="${k}" data-v="${v}" value="${v}">`;
    return `<label>${esc(FIELD_LABELS[k] || k)}${input}</label>`;
  }).join('') + (r.check === 'glued' ? '<div class="src">To split, cut the text here and say who the glued man is in the note; it is done by hand.</div>' : '');
}

function render() {
  tabs();
  list = filtered();
  if (i >= list.length) i = Math.max(0, list.length - 1);
  const open = rows.filter(r => !answers[r.key]).length;
  document.getElementById('count').textContent = `${open} open of ${rows.length}`;
  const main = document.getElementById('main'), bar = document.getElementById('bar');
  if (!list.length) { main.innerHTML = '<div class="empty">Nothing here.</div>'; bar.hidden = true; return; }
  bar.hidden = false;
  const r = list[i];
  document.getElementById('mergeBtn').style.display = r.twin ? '' : 'none';
  const a = answers[r.key];
  const others = (r.other || []).map(o => `<div class="box"><h3>Also in ${esc(o.book || o.pdf_file || 'another book')}: ${esc(o.name)}</h3>
      <div class="text">${esc(o.text)}</div>${crop(o)}</div>`).join('');
  const twin = r.twin ? `<div class="box"><h3>The first record of the entry: ${esc(r.twin.soldier_id)} ${esc(r.twin.name)}</h3>
      <div class="text">${esc(r.twin.text)}</div>${crop(r.twin)}</div>` : '';
  main.innerHTML = `
    <div class="meta"><span class="name">${esc(r.name)}</span><span class="chip">${esc(r.soldier_id)}</span>
      <span class="src">${esc(r.file)}</span><span class="src">${i + 1} / ${list.length}</span>
      ${a ? `<span class="answered ${a}">${a}</span>` : ''}</div>
    <div class="what"><b>${esc(LABELS[group(r)] || group(r))}</b> — ${esc(r.note)}</div>
    <div class="grid">
      <div class="box"><h3>The entry</h3><div class="text">${highlight(r.text, r)}</div>${crop(r)}</div>
      <div class="box edit"><h3>Fix: change what is wrong, then Enter</h3>${editor(r)}<div class="err" id="err"></div></div>
      ${twin}${others}
    </div>`;
  main.querySelectorAll('.edit input, .edit textarea').forEach(el => el.addEventListener('input', () =>
    el.classList.toggle('changed', el.value !== el.dataset.v)));
  document.getElementById('note').value = '';
}

async function answer(kind) {
  // taking back is for the last answer given, which has left the open list
  const r = kind === 'clear' && last ? last : list[i];
  if (!r) return;
  const body = { key: r.key, answer: kind, by, note: document.getElementById('note').value };
  if (kind === 'fix') {
    const fields = {};
    document.querySelectorAll('.edit [data-k]').forEach(el => { if (el.value !== el.dataset.v) fields[el.dataset.k] = el.value.trim(); });
    if (!Object.keys(fields).length) { document.getElementById('err').textContent = 'Change a field first.'; return; }
    body.fields = fields;
  }
  const res = await fetch('/api/answer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(x => x.json());
  if (res.error) { document.getElementById('err').textContent = res.error; return; }
  if (kind === 'clear') {
    delete answers[r.key];
    last = null;
    tab = group(r);
    render();
    i = Math.max(0, list.findIndex(x => x.key === r.key));
  } else {
    answers[r.key] = kind;
    last = r;
  }
  render();
}

document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.g; i = 0; render(); } });
document.getElementById('show').addEventListener('change', e => { show = e.target.value; i = 0; render(); });
document.getElementById('bar').addEventListener('click', e => { const b = e.target.closest('button[data-a]'); if (b) answer(b.dataset.a); });
document.getElementById('prev').onclick = () => { i = Math.max(0, i - 1); render(); };
document.getElementById('next').onclick = () => { i = Math.min(list.length - 1, i + 1); render(); };
document.getElementById('undo').onclick = () => answer('clear');
document.addEventListener('keydown', e => {
  const typing = e.target.matches('input, textarea');
  if (e.key === 'Enter' && !e.shiftKey && (!typing || e.target.closest('.edit'))) { e.preventDefault(); return answer('fix'); }
  if (typing) return;
  const k = e.key.toLowerCase();
  if (k === 'k') answer('keep'); else if (k === 'x') answer('delete'); else if (k === 'm' && list[i]?.twin) answer('merge');
  else if (k === 'u') answer('unsure'); else if (k === 'z') answer('clear');
  else if (e.key === 'ArrowRight') { i = Math.min(list.length - 1, i + 1); render(); }
  else if (e.key === 'ArrowLeft') { i = Math.max(0, i - 1); render(); }
});
load();
</script>
</body>
</html>
